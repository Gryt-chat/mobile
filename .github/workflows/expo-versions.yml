name: Expo versions

# Whether this app is behind the Expo SDK's latest patch releases. This used to be part
# of CI, where it turned main red three times with no change responsible — the answer
# comes off the network. A failure here means "there are patches to take"; the fix is
# `npx expo install --check` (GRYT-819).

on:
  schedule:
    # Monday morning, so a week's worth of Expo releases arrive as one job rather than a
    # red mark on an unrelated pull request.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: expo-versions
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile

      # The whole point of this workflow, so it is not skipped here the way CI skips it.
      # Everything else expo-doctor checks is covered by CI on every push.
      - name: Check for Expo SDK patch releases
        run: npx expo-doctor
