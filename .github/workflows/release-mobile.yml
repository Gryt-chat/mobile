name: Release Mobile

# Ship both halves from one commit so the numbers do not drift — iOS was at 25 while
# Play served 4. The children are told not to bump; it happens once, here.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track for the Android half"
        required: true
        default: "internal,alpha"
        type: choice
        options: [internal, "internal,alpha", alpha, beta, production]
      notes:
        description: "What testers should look at (optional)"
        required: false
        type: string

# The caller holds `release-mobile`; called children take their own groups, so they run side by side.
concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  android:
    name: Android
    uses: ./.github/workflows/release-android.yml
    with:
      track: ${{ inputs.track }}
      notes: ${{ inputs.notes }}
      bump: false
    secrets: inherit

  # Beside Android, not after it. Neither bumps when called, so nothing in them conflicts.
  ios:
    name: iOS
    uses: ./.github/workflows/release-ios.yml
    with:
      notes: ${{ inputs.notes }}
      bump: false
    secrets: inherit

  bump:
    name: Bump the build numbers
    needs: [android, ios]
    # Either upload spends its number, so one half failing still has to bump.
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      # No `yarn install`. `bump-build.mts` imports node:fs and nothing else,
      # and installing to run one script costs more than the step it feeds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump and push
        run: |
          node scripts/bump-build.mts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --cached --quiet; then
            echo "Nothing to bump."
            exit 0
          fi
          BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          git commit \
            -m "chore: bump build numbers after the ${{ inputs.track }} release [skip ci]" \
            -m "Next iOS buildNumber is $BUILD, next Android versionCode is $CODE. Both stores refuse a repeat."
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      # One post per platform, each to its own webhook; unset falls back to the shared one, and neither means no post.
      - name: "Post the builds to #testing"
        env:
          IOS_WEBHOOK: ${{ secrets.GRYT_TESTING_IOS_WEBHOOK_URL || secrets.GRYT_TESTING_WEBHOOK_URL }}
          ANDROID_WEBHOOK: ${{ secrets.GRYT_TESTING_ANDROID_WEBHOOK_URL || secrets.GRYT_TESTING_WEBHOOK_URL }}
          NOTES: ${{ inputs.notes }}
          TRACK: ${{ inputs.track }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          body() {
            node -e '
              const [platform, version, notes, track] = process.argv.slice(1);
              const lines = platform === "ios"
                ? [`**New iPhone test build of Gryt, version ${version}**`,
                   "It shows up in TestFlight once Apple has processed it. New testers join at https://testflight.apple.com/join/6sckEEFx"]
                : track.includes("alpha")
                  ? [`**New Android test build of Gryt, version ${version}**`,
                     "How to get in, no email needed: https://gryt.chat/#phone-test"]
                  : [`**New Android test build of Gryt, version ${version}**`, "Internal testers only for this one."];
              if (notes) lines.push("", notes);
              process.stdout.write(JSON.stringify({ text: lines.join("\n") }));
            ' "$1" "$VERSION" "$NOTES" "$TRACK"
          }
          # The builds are out by now, so a server that's down only costs the post, never the release.
          post() {
            if [ -z "$2" ]; then echo "No webhook for $1, so nothing was posted."; return; fi
            if body "$1" | curl -fsS -m 20 -X POST -H "content-type: application/json" --data @- "$2" >/dev/null; then
              echo "Posted the $1 build to #testing."
            else
              echo "::warning::Couldn't post the $1 build to #testing; the release itself went through."
            fi
          }
          if [ "$IOS" = "success" ]; then post ios "$IOS_WEBHOOK"; fi
          if [ "$ANDROID" = "success" ]; then post android "$ANDROID_WEBHOOK"; fi

      - name: Say what shipped
        run: |
          {
            echo "### Both halves, one commit"
            echo
            echo "Android went to \`${{ inputs.track }}\`; iOS went to TestFlight."
            echo "Next iOS buildNumber and Android versionCode are in the bump commit."
            echo
            echo "Apple processes the build before it appears, and a failure there"
            echo "arrives by email rather than here."
          } >> "$GITHUB_STEP_SUMMARY"
