name: Release Mobile

# Ship both halves from one commit so the numbers do not drift — iOS was at 25 while
# Play served 4. The children are told not to bump; it happens once, here.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track for the Android half"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      notes:
        description: "What testers should look at (optional)"
        required: false
        type: string

# No concurrency group on purpose: both children take `release-mobile`, and a caller
# holding it would queue them behind itself. A single dispatch slipping in costs a number.

jobs:
  android:
    name: Android
    uses: ./.github/workflows/release-android.yml
    with:
      track: ${{ inputs.track }}
      notes: ${{ inputs.notes }}
      bump: false
    secrets: inherit

  # After Android rather than beside it: in parallel the second would sit queued anyway.
  # Android is the shorter, so a credential problem surfaces in fifteen minutes.
  ios:
    name: iOS
    needs: android
    uses: ./.github/workflows/release-ios.yml
    with:
      notes: ${{ inputs.notes }}
      bump: false
    secrets: inherit

  bump:
    name: Bump the build numbers
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      # No `yarn install`. `bump-build.mjs` imports node:fs and nothing else,
      # and installing to run one script costs more than the step it feeds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump and push
        run: |
          node scripts/bump-build.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --cached --quiet; then
            echo "Nothing to bump."
            exit 0
          fi
          BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          git commit \
            -m "chore: bump build numbers after the ${{ inputs.track }} release [skip ci]" \
            -m "Next iOS buildNumber is $BUILD, next Android versionCode is $CODE. Both stores refuse a repeat."
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Say what shipped
        run: |
          {
            echo "### Both halves, one commit"
            echo
            echo "Android went to \`${{ inputs.track }}\`; iOS went to TestFlight."
            echo "Next iOS buildNumber and Android versionCode are in the bump commit."
            echo
            echo "Apple processes the build before it appears, and a failure there"
            echo "arrives by email rather than here."
          } >> "$GITHUB_STEP_SUMMARY"
