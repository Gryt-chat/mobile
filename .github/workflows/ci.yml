name: CI

on:
  pull_request:
  push:
    branches: [main]

# Same reasoning as android.yml: a second push supersedes the first rather than
# running both to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # The Android job already caches yarn's store and this one did not,
          # so every run re-downloaded a tree the other had sitting there.
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit

      # `meetLayout` is pure arithmetic in its own file precisely so it can be
      # checked here. The two worst layout bugs in this codebase were both sums.
      - run: yarn test

      # `expo-doctor` checks the things that only bite at prebuild or build
      # time: a config plugin that cannot resolve, native folders committed
      # against a prebuild project, a malformed app config. All of those pass a
      # typecheck and fail on a device, so they stay blocking.
      #
      # The dependency-version check is skipped here, and only here.
      #
      # It compares installed versions against what Expo has *most recently
      # published* for the SDK, resolved at run time from the network. Nothing
      # in this repository decides its answer. So Expo shipping a patch turns
      # main red with no commit responsible — and it fails *after* the merge
      # rather than on the pull request, so it lands on main and the next person
      # to open one starts from a red base.
      #
      # That has happened three times: GRYT-658 in August with eight packages
      # behind, and twice on 2026-09-01 with ten. Each time the fix was the same
      # mechanical bump and each time it blocked unrelated work first.
      #
      # Being behind is still worth knowing, so it is not switched off — it
      # moved to expo-versions.yml, which runs on a schedule and reports. A
      # check that fires on somebody else's release calendar is a notification,
      # not a merge gate.
      - run: npx expo-doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
