name: CI

on:
  pull_request:
  push:
    branches: [main]

# Same reasoning as android.yml: a second push supersedes the first rather than
# running both to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # The Android job already caches yarn's store and this one did not,
          # so every run re-downloaded a tree the other had sitting there.
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit

      # `meetLayout` is pure arithmetic in its own file precisely so it can be
      # checked here. The two worst layout bugs in this codebase were both sums.
      - run: yarn test

      # `expo-doctor` checks the things that only bite at prebuild or build
      # time: dependency versions that do not match the installed Expo SDK, a
      # config plugin that cannot resolve, native folders committed against a
      # prebuild project. All of those pass a typecheck and fail on a device.
      - run: npx expo-doctor
