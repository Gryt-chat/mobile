name: Android

# Separate from ci.yml so it can be path-filtered without taking the typecheck
# with it. A `paths:` filter on ci.yml would skip everything, not just this.
#
# Why it exists at all: plugins/withAndroidHighRefreshRate.js injects Kotlin
# into MainActivity, and nothing else in this repository can tell you whether
# that Kotlin compiles — not the typecheck, not expo-doctor, not the iOS build.
#
# Why it does not run on every pull request: it is ~14 minutes, and almost all
# of that is Gradle compiling Hermes, the New Architecture codegen and
# JitsiWebRTC. A JavaScript-only change cannot break any of that, so paying for
# it on a docs typo buys nothing.
on:
  pull_request:
    paths:
      - "app.json"
      - "package.json"
      - "yarn.lock"
      - "plugins/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "app.json"
      - "package.json"
      - "yarn.lock"
      - "plugins/**"
      - ".github/workflows/android.yml"
  # So a native build can still be demanded on a change the filter did not
  # match — a react-native upgrade landing through some other file, say.
  workflow_dispatch:

# Pushing again supersedes the build that is already running, rather than
# leaving both to finish. A rebase used to leave a 20-minute build compiling a
# commit nobody was going to merge, and the two runs raced for the same
# answer.
#
# `main` is excluded from cancellation by keying on the ref: a push to main is
# the one build whose result is a record rather than a gate.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle **build cache**, which is not the thing that was tried and
      # removed before.
      #
      # That attempt cached `~/.gradle` for its *downloads*, and the log showed
      # zero of those — so it saved nothing and cost 127s to write. The note it
      # left said the time goes on compiling Hermes, the codegen and the native
      # libraries, and that none of it survives because `android/` is
      # regenerated by `expo prebuild` every run.
      #
      # The first half is right and the second half does not follow. The build
      # cache is keyed on task inputs, not on the output directory, so a task
      # whose inputs have not changed is a hit even though the folder it wrote
      # into is new. The last run reported `449 executed, 100 from cache` with
      # an empty cache; the point of keeping it is to move more of those 449.
      #
      # If a measured run shows it is not moving them, delete this and say so
      # here — as the last attempt did.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'app.json') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-
      - run: yarn install --frozen-lockfile
      - run: npx expo prebuild --platform android --no-install

      # The point of the job. If the plugin silently stops firing, fail here
      # rather than shipping a 60 Hz app with a green tick.
      - name: Check the refresh-rate plugin actually injected
        run: grep -q "requestHighestRefreshRate" android/app/src/main/java/chat/gryt/mobile/MainActivity.kt

      # Build caching on, and the daemon left enabled — a daemon is wasted on a
      # one-shot runner either way, and --no-daemon disables the configuration
      # cache along with it.
      # One architecture, not four.
      #
      # This is where the twenty minutes went. `buildCMakeDebug` runs once per
      # ABI — arm64-v8a, armeabi-v7a, x86, x86_64 — at about ninety seconds
      # each, and the question this job asks is whether the build works at all.
      # A second architecture does not answer it twice.
      #
      # arm64-v8a because it is what every phone made in the last several years
      # runs, so if only one is going to be compiled it should be the real one.
      # A release build is not produced here and would set its own list.
      - run: ./gradlew :app:assembleDebug --build-cache -PreactNativeArchitectures=arm64-v8a
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
