name: Android

# Separate from ci.yml so it can be path-filtered without taking the typecheck with
# it. `plugin` asks whether the config plugin fired — the failure that silently ships
# a 60 Hz app — and runs on every PR; `build` asks whether the toolchain still
# assembles an APK, takes twelve minutes, and runs on main and on demand.
on:
  pull_request:
    paths:
      - "app.json"
      - "package.json"
      - "yarn.lock"
      - "plugins/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "app.json"
      - "package.json"
      - "yarn.lock"
      - "plugins/**"
      - ".github/workflows/android.yml"
  # So a native build can still be demanded on a change the filter did not match, or
  # on a pull request somebody wants the full build for.
  workflow_dispatch:

# Pushing again supersedes the run already going. `main` is excluded by keying on the
# ref: a push to main is the one build whose result is a record rather than a gate.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Two minutes. Runs everywhere, including pull requests.
  plugin:
    name: Config plugin fires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx expo prebuild --platform android --no-install

      # The point of the job. If the plugin silently stops firing, fail here
      # rather than shipping a 60 Hz app with a green tick.
      - name: Check the refresh-rate plugin actually injected
        run: grep -q "requestHighestRefreshRate" android/app/src/main/java/chat/gryt/mobile/MainActivity.kt

      # Screen sharing needs a permission the app declares itself. On Android 14 its
      # absence is a SecurityException thrown the moment somebody taps share.
      - name: Check the screen-share permissions are declared
        run: grep -q "FOREGROUND_SERVICE_MEDIA_PROJECTION" android/app/src/main/AndroidManifest.xml

      # Being in the share sheet is a manifest fact decided at install time. There is
      # no runtime check and no error — Gryt is simply not offered.
      - name: Check Gryt is a share target
        run: |
          grep -q "android.intent.action.SEND\"" android/app/src/main/AndroidManifest.xml
          grep -q "android.intent.action.SEND_MULTIPLE" android/app/src/main/AndroidManifest.xml

      # The iOS half of the same plugin, which the Android prebuild does not exercise.
      # Every way it can quietly stop working ends in a broadcast that starts, shows
      # the red status bar, and sends nobody a frame. No Xcode needed.
      - run: npx expo prebuild --platform ios --no-install
      - name: Check the broadcast extension was added
        run: |
          test -f ios/GrytBroadcast/SampleHandler.swift
          grep -q "com.apple.broadcast-services-upload" ios/GrytBroadcast/GrytBroadcast-Info.plist
          grep -q "GrytBroadcast.appex" ios/Gryt.xcodeproj/project.pbxproj

      # And the share extension, which fails the same silent way: it simply is
      # not in the share sheet, and there is nothing to see that says why.
      - name: Check the share extension was added
        run: |
          test -f ios/GrytShare/ShareViewController.swift
          grep -q "com.apple.share-services" ios/GrytShare/GrytShare-Info.plist
          grep -q "GrytShare.appex" ios/Gryt.xcodeproj/project.pbxproj
          grep -q "group.chat.gryt.mobile" ios/GrytShare/GrytShare.entitlements
          # Both ends of the socket have to name the same App Group, and each
          # reads it from its own plist.
          grep -q "group.chat.gryt.mobile" ios/Gryt/Info.plist
          grep -q "group.chat.gryt.mobile" ios/Gryt/Gryt.entitlements
          grep -q "group.chat.gryt.mobile" ios/GrytBroadcast/GrytBroadcast.entitlements

  # Twelve minutes. Main and on-demand only — see the note at the top.
  build:
    name: Native build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle **build cache**, which is not the `~/.gradle` download cache that
      # was tried and removed: this is keyed on task inputs, so a task whose inputs
      # have not changed is a hit even though `expo prebuild` rewrote the folder.
      #
      # **If a warm run does not move the from-cache count, delete this and say so.**
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('yarn.lock', 'app.json') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-

      - run: yarn install --frozen-lockfile
      - run: npx expo prebuild --platform android --no-install

      # One architecture, not four. `buildCMakeDebug` runs once per ABI at about
      # ninety seconds each, and a second does not answer the question twice.
      # Measured: 20m52s → 11m43s. arm64-v8a, because it is what phones run.
      - run: ./gradlew :app:assembleDebug --build-cache -PreactNativeArchitectures=arm64-v8a
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
