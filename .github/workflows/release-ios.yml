name: Release iOS

# Cut a TestFlight build, from here rather than from one Mac. The Android half is
# `release-android.yml`; this needs a macOS runner, hence its own file.
#
# **Signing is automatic for the archive, driven by an App Store Connect API key.**
# The export is the exception: Gryt's certificate is cloud-managed and cloud signing
# needs an Admin-role key, while Gryt's is App Manager. So the keychain step below
# supplies a .p12 and `scripts/ios-profiles.mjs` makes the profiles over the API.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What testers should look at (optional)"
        required: false
        type: string
      bump:
        description: "Bump the build numbers afterwards"
        required: false
        default: true
        type: boolean
  # Called by `release-mobile.yml` — see the note on the bump step below.
  workflow_call:
    inputs:
      notes:
        required: false
        type: string
      bump:
        required: false
        default: true
        type: boolean

# Shared with `release-android.yml` on purpose: `yarn bump:build` moves both numbers
# together, so two releases at once would have one push lose.
concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload
    # macOS 26, not 15. The pods want Swift tools 6.2 and the macos-15 image selects
    # Xcode 16.4, whose Swift is 6.1.
    runs-on: macos-26
    # A cold pod install and a full archive. Generous because a timeout here
    # costs the whole build, and macOS minutes are billed either way.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # The bump at the end is pushed, so this needs a branch rather than a
          # detached head.
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # ── The toolchain, asserted before anything long runs ───────────────
      #
      # Take the newest Xcode the image has rather than whatever is selected, and
      # refuse early. A wrong toolchain is otherwise a twenty-minute failure whose
      # message names neither Xcode nor the runner image.
      - name: Select the newest Xcode and check the Swift version
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode on this runner image." >&2
            exit 1
          fi
          sudo xcode-select -s "$LATEST"
          echo "Selected $LATEST"
          xcodebuild -version
          swift --version

          SWIFT=$(swift --version 2>&1 | sed -n 's/.*Apple Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)
          MAJOR=${SWIFT%%.*}
          MINOR=${SWIFT#*.}
          if [ "$MAJOR" -lt 6 ] || { [ "$MAJOR" -eq 6 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "::error::Swift $SWIFT is too old — the pods need 6.2 (Xcode 26). Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')" >&2
            exit 1
          fi
          echo "Swift $SWIFT is new enough."

      - run: yarn install --frozen-lockfile

      # ── The API key ─────────────────────────────────────────────────────
      #
      # Two consumers, one file. `xcodebuild` is told where it is; `altool` insists
      # on finding it under ~/.appstoreconnect/private_keys, named for the key id.
      - name: Write the App Store Connect key
        id: asc
        env:
          KEY_P8: ${{ secrets.GRYT_IOS_ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.GRYT_IOS_ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.GRYT_IOS_ASC_ISSUER_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::error::GRYT_IOS_ASC_KEY_P8, GRYT_IOS_ASC_KEY_ID and GRYT_IOS_ASC_ISSUER_ID must all be set. See the README, 'Uploading it'." >&2
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          cp "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" ~/.appstoreconnect/private_keys/
          # A secret pasted without its header decodes to nothing useful and
          # fails inside xcodebuild forty lines later. Check the shape here.
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" || {
            echo "::error::The key does not look like a .p8 — no PEM header. Paste the whole file, including the BEGIN and END lines." >&2
            exit 1
          }
          echo "path=$RUNNER_TEMP/AuthKey_$KEY_ID.p8" >> "$GITHUB_OUTPUT"

      # ── The distribution certificate, if there is one ───────────────────
      #
      # Optional, and the difference between an export that signs and one that asks
      # Apple to and is refused. A throwaway keychain, not the login one.
      - name: Import the distribution certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.GRYT_IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.GRYT_IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::notice::No GRYT_IOS_DIST_CERT_P12. The export will use cloud signing, which needs an Admin-role App Store Connect key — an App Manager key fails with 'Cloud signing permission error'. See the README, 'Or from CI, which is the point'."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/gryt-signing.keychain-db"
          # Generated, not a secret to manage. It guards a keychain that exists
          # for one job and is deleted at the end of it.
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock: the default relocks after five idle minutes and a pod
          # install is longer, so codesign would prompt nobody can answer.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          test -s "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"

          # Without this the key imports and codesign is still prompted for
          # permission, which on a runner hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Prepended rather than replacing the list: xcodebuild reads the login
          # keychain for other things.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # A .p12 holding only a certificate imports without complaint and fails
          # at export with the same message as importing nothing.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::The .p12 imported but holds no Apple Distribution identity. Export it from Keychain Access as a certificate *with* its private key." >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "cert=Apple Distribution" >> "$GITHUB_OUTPUT"

      # Every run, not once. A profile is a snapshot of the certificates it was
      # built with, so a replaced certificate leaves the old profiles stale.
      - name: Make the App Store profiles
        id: profiles
        if: steps.signing.outputs.keychain != ''
        env:
          GRYT_IOS_ASC_KEY_PATH: ${{ steps.asc.outputs.path }}
          GRYT_IOS_ASC_KEY_ID: ${{ secrets.GRYT_IOS_ASC_KEY_ID }}
          GRYT_IOS_ASC_ISSUER_ID: ${{ secrets.GRYT_IOS_ASC_ISSUER_ID }}
        run: |
          # Progress goes to stderr and only the map to stdout, so this captures
          # the map alone.
          MAP=$(node scripts/ios-profiles.mjs)
          echo "map=$MAP" >> "$GITHUB_OUTPUT"

      # A UTF-8 locale, because CocoaPods dies without one under Ruby 4 and the
      # error names encodings rather than pods.
      - name: Build the archive and export the ipa
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          GRYT_IOS_ASC_KEY_PATH: ${{ steps.asc.outputs.path }}
          GRYT_IOS_ASC_KEY_ID: ${{ secrets.GRYT_IOS_ASC_KEY_ID }}
          GRYT_IOS_ASC_ISSUER_ID: ${{ secrets.GRYT_IOS_ASC_ISSUER_ID }}
          # Empty when no .p12 was imported, and `testflight.sh` then writes the
          # export options it always wrote.
          GRYT_IOS_SIGNING_CERT: ${{ steps.signing.outputs.cert }}
          # Empty when no certificate was imported, and the export then falls
          # back to automatic signing exactly as it used to.
          GRYT_IOS_PROFILE_MAP: ${{ steps.profiles.outputs.map }}
        run: yarn testflight

      - name: Find the ipa
        id: ipa
        run: |
          IPA=$(ls -t build/testflight/export/*.ipa | head -1)
          test -f "$IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Built $IPA"

      - name: Upload to TestFlight
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          xcrun altool --upload-app -t ios \
            -f "${{ steps.ipa.outputs.path }}" \
            --apiKey "${{ secrets.GRYT_IOS_ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.GRYT_IOS_ASC_ISSUER_ID }}"

      # After the upload and only on success: App Store Connect refuses a repeated
      # build number, and bumping after a failure spends one on nothing.

      # Skipped when `release-mobile.yml` is driving; it bumps once for both.
      - name: Bump the build numbers
        if: inputs.bump
        run: yarn bump:build

      - name: Push the bump
        if: inputs.bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --cached --quiet; then
            echo "Nothing to bump."
            exit 0
          fi
          BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")
          git commit \
            -m "chore: bump build numbers after the TestFlight upload [skip ci]" \
            -m "Next iOS buildNumber is $BUILD. App Store Connect refuses a repeat, so this has to move whether or not the next build is iOS."
          # Rebased rather than forced. The concurrency group stops the two
          # workflows overlapping; this is for main having moved meanwhile.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      # Whatever happened above. The runner is thrown away either way; this is here
      # so a workflow copied from this one cleans up after itself.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true

      - name: Keep the ipa
        if: always() && steps.ipa.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: gryt-ios-testflight
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14

      - name: Say where it went
        run: |
          {
            echo "### iOS → TestFlight"
            echo
            echo "\`${{ steps.ipa.outputs.path }}\`"
            echo
            echo "Apple processes the build before it appears, which takes a few"
            echo "minutes. Nothing here can tell you it failed processing — that"
            echo "arrives by email, and it is the one failure this workflow"
            echo "cannot catch."
            if [ -n "${{ inputs.notes }}" ]; then
              echo
              echo "**Notes:** ${{ inputs.notes }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
