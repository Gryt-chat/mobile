name: Release iOS

# Cut a TestFlight build, from here rather than from one Mac.
#
# The Android half of this is `release-android.yml` (GRYT-864) and this is the
# same shape: dispatch it, it builds, signs, uploads and bumps. The difference
# is that it needs a macOS runner, which is why it is a separate file — putting
# both in one workflow would make every Android release wait for a Mac.
#
# **Signing is automatic, driven by an App Store Connect API key** — for the
# archive. `scripts/testflight.sh` archives and exports with
# `-allowProvisioningUpdates`, and the key lets a runner ask App Store Connect
# for the profiles a laptop gets from Xcode's signed-in session.
#
# The export is the exception, and this file said otherwise until 2026-09-02.
# Gryt's Apple Distribution certificate is cloud-managed: Apple holds the
# private key and signs on request, so there is no certificate to copy and none
# in anybody's keychain. A laptop may use it because Xcode is signed in. An API
# key may stand in for that only with the **Admin** role, and Gryt's is App
# Manager — so the export failed with "Cloud signing permission error" and
# "No signing certificate iOS Distribution found", twenty minutes into a run
# that had already archived cleanly.
#
# Hence the keychain step below. Give it a distribution .p12 and the export
# signs with that instead of asking Apple to. It is optional: with an Admin-role
# key, cloud signing works and the step stands aside.
#
# The certificate was half of it. With one in the keychain the export got past
# "no signing certificate" and stopped on "No profiles for chat.gryt.mobile
# were found", still with a cloud signing error beside it, because *automatic*
# signing asks App Store Connect for the profile the same forbidden way. So
# `scripts/ios-profiles.mjs` makes the profiles over the API — a different
# operation, and one an App Manager key may do — and the export is told to sign
# manually against them.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What testers should look at (optional)"
        required: false
        type: string

# Shared with `release-android.yml` on purpose. `yarn bump:build` moves the iOS
# and Android numbers together, so two releases at once both bump and one of the
# two pushes loses — after its upload has already spent the number.
concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload
    # macOS 26, not 15. The pods want Swift tools 6.2 and the macos-15 image
    # selects Xcode 16.4, whose Swift is 6.1 — see the toolchain check below for
    # what that failure looks like.
    runs-on: macos-26
    # A cold pod install and a full archive. Generous because a timeout here
    # costs the whole build, and macOS minutes are billed either way.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # The bump at the end is pushed, so this needs a branch rather than a
          # detached head.
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # ── The toolchain, asserted before anything long runs ───────────────
      #
      # The first CI archive died twenty minutes in with
      #
      #   xcodebuild: error: Could not resolve package dependencies:
      #     package 'apple' is using Swift tools version 6.2.0 but the
      #     installed version is 6.1.0
      #
      # which names neither Xcode nor the runner image. The cause was the image
      # defaulting to Xcode 16.4 while the pods need Swift 6.2, i.e. Xcode 26.
      #
      # So: take the newest Xcode the image has rather than whatever is
      # selected, and refuse early if it is still too old. A wrong toolchain is
      # a twenty-minute failure otherwise, and the message does not point here.
      - name: Select the newest Xcode and check the Swift version
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode on this runner image." >&2
            exit 1
          fi
          sudo xcode-select -s "$LATEST"
          echo "Selected $LATEST"
          xcodebuild -version
          swift --version

          SWIFT=$(swift --version 2>&1 | sed -n 's/.*Apple Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)
          MAJOR=${SWIFT%%.*}
          MINOR=${SWIFT#*.}
          if [ "$MAJOR" -lt 6 ] || { [ "$MAJOR" -eq 6 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "::error::Swift $SWIFT is too old — the pods need 6.2 (Xcode 26). Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')" >&2
            exit 1
          fi
          echo "Swift $SWIFT is new enough."

      - run: yarn install --frozen-lockfile

      # ── The API key ─────────────────────────────────────────────────────
      #
      # Two consumers, one file. `xcodebuild` is told where it is; `altool`
      # insists on finding it itself, under ~/.appstoreconnect/private_keys and
      # named for the key id. Writing it once in both shapes is cheaper than
      # explaining later why the archive signed and the upload did not.
      - name: Write the App Store Connect key
        id: asc
        env:
          KEY_P8: ${{ secrets.GRYT_IOS_ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.GRYT_IOS_ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.GRYT_IOS_ASC_ISSUER_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::error::GRYT_IOS_ASC_KEY_P8, GRYT_IOS_ASC_KEY_ID and GRYT_IOS_ASC_ISSUER_ID must all be set. See the README, 'Uploading it'." >&2
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          cp "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" ~/.appstoreconnect/private_keys/
          # A secret pasted without its header decodes to nothing useful and
          # fails inside xcodebuild forty lines later. Check the shape here.
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" || {
            echo "::error::The key does not look like a .p8 — no PEM header. Paste the whole file, including the BEGIN and END lines." >&2
            exit 1
          }
          echo "path=$RUNNER_TEMP/AuthKey_$KEY_ID.p8" >> "$GITHUB_OUTPUT"

      # ── The distribution certificate, if there is one ───────────────────
      #
      # Optional, and it is the difference between an export that signs and one
      # that asks Apple to sign and is refused — see the note at the top.
      #
      # A throwaway keychain rather than the login one. The runner is discarded
      # anyway, but a private key added to `login.keychain` is a private key in
      # whatever else runs on that machine during the job, and the cleanup step
      # at the bottom has something specific to delete.
      - name: Import the distribution certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.GRYT_IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.GRYT_IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::notice::No GRYT_IOS_DIST_CERT_P12. The export will use cloud signing, which needs an Admin-role App Store Connect key — an App Manager key fails with 'Cloud signing permission error'. See the README, 'Or from CI, which is the point'."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/gryt-signing.keychain-db"
          # Generated, not a secret to manage. It guards a keychain that exists
          # for one job and is deleted at the end of it.
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock. The default relocks after five minutes of idle and a
          # pod install is longer than that, so codesign would fail partway
          # through the export with a prompt nobody can answer.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          test -s "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"

          # Without this the key is imported and codesign is still prompted for
          # permission to use it, which on a runner means it hangs until the
          # job times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Prepended rather than replacing the list. xcodebuild reads the
          # login keychain for other things, and dropping it produces failures
          # that have nothing to do with signing.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # A .p12 holding only a certificate, or the wrong one, imports
          # without complaint and fails at export as "no signing certificate" —
          # the same message as importing nothing, which is a slow way to find
          # out the secret was wrong.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::The .p12 imported but holds no Apple Distribution identity. Export it from Keychain Access as a certificate *with* its private key." >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "cert=Apple Distribution" >> "$GITHUB_OUTPUT"

      # Every run, not once. A profile is a snapshot of the certificates it was
      # built with, so the day the certificate is replaced the old profiles
      # still name the old one and the export signs with something they do not
      # list. Making them here means that can never be stale.
      - name: Make the App Store profiles
        id: profiles
        if: steps.signing.outputs.keychain != ''
        env:
          GRYT_IOS_ASC_KEY_PATH: ${{ steps.asc.outputs.path }}
          GRYT_IOS_ASC_KEY_ID: ${{ secrets.GRYT_IOS_ASC_KEY_ID }}
          GRYT_IOS_ASC_ISSUER_ID: ${{ secrets.GRYT_IOS_ASC_ISSUER_ID }}
        run: |
          # Progress goes to stderr and only the map to stdout, so this captures
          # the map alone.
          MAP=$(node scripts/ios-profiles.mjs)
          echo "map=$MAP" >> "$GITHUB_OUTPUT"

      # A UTF-8 locale, because CocoaPods dies without one under Ruby 4 and the
      # error names encodings rather than pods. `testflight.sh` exports these
      # too; a runner does not inherit them from anywhere.
      - name: Build the archive and export the ipa
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          GRYT_IOS_ASC_KEY_PATH: ${{ steps.asc.outputs.path }}
          GRYT_IOS_ASC_KEY_ID: ${{ secrets.GRYT_IOS_ASC_KEY_ID }}
          GRYT_IOS_ASC_ISSUER_ID: ${{ secrets.GRYT_IOS_ASC_ISSUER_ID }}
          # Empty when no .p12 was imported, and `testflight.sh` then writes the
          # export options it always wrote.
          GRYT_IOS_SIGNING_CERT: ${{ steps.signing.outputs.cert }}
          # Empty when no certificate was imported, and the export then falls
          # back to automatic signing exactly as it used to.
          GRYT_IOS_PROFILE_MAP: ${{ steps.profiles.outputs.map }}
        run: yarn testflight

      - name: Find the ipa
        id: ipa
        run: |
          IPA=$(ls -t build/testflight/export/*.ipa | head -1)
          test -f "$IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Built $IPA"

      - name: Upload to TestFlight
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          xcrun altool --upload-app -t ios \
            -f "${{ steps.ipa.outputs.path }}" \
            --apiKey "${{ secrets.GRYT_IOS_ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.GRYT_IOS_ASC_ISSUER_ID }}"

      # After the upload and only on success, for the reason the Android one
      # gives: App Store Connect refuses a repeated build number once the
      # transfer finishes, and bumping after a failure spends a number on a
      # build nobody has.
      - name: Bump the build numbers
        run: yarn bump:build

      - name: Push the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --cached --quiet; then
            echo "Nothing to bump."
            exit 0
          fi
          BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")
          git commit \
            -m "chore: bump build numbers after the TestFlight upload [skip ci]" \
            -m "Next iOS buildNumber is $BUILD. App Store Connect refuses a repeat, so this has to move whether or not the next build is iOS."
          # Rebased rather than forced. The Android workflow pushes the same
          # file, and the concurrency group above stops them overlapping — this
          # is for the ordinary case of main having moved meanwhile.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      # Whatever happened above. The runner is thrown away either way, so this
      # buys little on its own; it is here so that a workflow copied from this
      # one starts out cleaning up after itself.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true

      - name: Keep the ipa
        if: always() && steps.ipa.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: gryt-ios-testflight
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14

      - name: Say where it went
        run: |
          {
            echo "### iOS → TestFlight"
            echo
            echo "\`${{ steps.ipa.outputs.path }}\`"
            echo
            echo "Apple processes the build before it appears, which takes a few"
            echo "minutes. Nothing here can tell you it failed processing — that"
            echo "arrives by email, and it is the one failure this workflow"
            echo "cannot catch."
            if [ -n "${{ inputs.notes }}" ]; then
              echo
              echo "**Notes:** ${{ inputs.notes }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
